<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="You &amp; Friends">
  <!--
    The app icon: the ampersand of the wordmark, set in Newsreader Italic.

    `docs/DESIGN.md` §16 — "The wordmark is typeset in the editorial serif, with the ampersand
    permitted in an italic optical variant. No separate logo mark is to be invented." So this is
    not a drawn mark: it is the real glyph, extracted from the same Newsreader Italic the product
    renders its titles in, as a path so it needs no font at raster time.

    Maskable variant: the glyph is drawn at 40% rather than 58%, so it survives the circular and
    squircle crops Android applies without losing its shoulders.
  -->
